<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>マスモンチャンピオンズ</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Zen+Antique&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: blackboard / graph-paper surface. Header with three tabs (対戦 / 図鑑 / 企画書).
   Battle = arena (two fighters) left, commands + log right. Dex = card grid. Plan = single readable column. */
:root {
  --bg: #eef2f0;
  --grid: #d7e0dc;
  --panel: #fbfdfc;
  --fg: #12201c;
  --muted: #53655f;
  --line: #c3d0ca;
  --accent: #0f6b52;
  --on-accent: #ffffff;
  --t0: #b8400b; /* 数論 */
  --t1: #5f3dc4; /* 代数 */
  --t2: #0a7a5a; /* 幾何 */
  --t3: #1864ab; /* 解析 */
  --t4: #b0124f; /* 確率 */
  --t5: #7a5c00; /* 論理 */
  --hp-ok: #1f8f55;
  --hp-mid: #c28a00;
  --hp-low: #c0392b;
  --font-display: 'Zen Antique', 'Shippori Mincho', 'Hiragino Mincho ProN', 'Yu Mincho', serif;
  --font-body: 'Zen Kaku Gothic New', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Yu Gothic', sans-serif;
  --font-mono: 'DM Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1715; --grid: #18262366; --panel: #15221f; --fg: #e8efe9; --muted: #98aca4; --line: #2b3f39;
    --accent: #7ddfbb; --on-accent: #08241b;
    --t0: #ff8a4c; --t1: #a58bff; --t2: #3ddba6; --t3: #5aa9ff; --t4: #ff6f9c; --t5: #e5c14b;
    --hp-ok: #3fcf7f; --hp-mid: #e5b53a; --hp-low: #ff6b5b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1715; --grid: #18262366; --panel: #15221f; --fg: #e8efe9; --muted: #98aca4; --line: #2b3f39;
  --accent: #7ddfbb; --on-accent: #08241b;
  --t0: #ff8a4c; --t1: #a58bff; --t2: #3ddba6; --t3: #5aa9ff; --t4: #ff6f9c; --t5: #e5c14b;
  --hp-ok: #3fcf7f; --hp-mid: #e5b53a; --hp-low: #ff6b5b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background-color: var(--bg);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px;
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(28px, 6vw, 44px); line-height: 1.15; margin: 0; letter-spacing: .02em; text-wrap: balance; }
.sub { font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
.tabs { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); padding: 4px; border-radius: 10px; }
.tabs button { font: inherit; font-weight: 700; border: 0; background: transparent; color: var(--muted); padding: 8px 18px; border-radius: 7px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--on-accent); }
button:focus-visible, input:focus-visible + .upl { outline: 2px solid var(--accent); outline-offset: 2px; }
h2 { font-family: var(--font-display); font-weight: 400; font-size: 22px; margin: 0 0 4px; text-wrap: balance; }
h3 { font-size: 14px; margin: 0 0 8px; letter-spacing: .04em; }
p { margin: 0; }
.muted { color: var(--muted); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.chip { display: inline-block; font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: .06em; padding: 1px 8px; border-radius: 99px; color: var(--c); border: 1px solid var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); white-space: nowrap; }
.chip.btn { font-family: var(--font-body); font-size: 13px; padding: 3px 12px; cursor: pointer; }
.chip.btn[aria-pressed="true"] { background: var(--c); color: var(--panel); }
.glyph { flex: none; width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; color: var(--c); border: 2px solid var(--c); background: color-mix(in srgb, var(--c) 10%, var(--panel)); overflow: hidden; }
.glyph > svg { width: 100%; height: 100%; display: block; }
.glyph svg svg { stroke-width: 3.6px; }
.eye { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
.fighter .glyph > svg { animation: bob 3.4s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-1.5px); } }
.glyph img { width: 100%; height: 100%; object-fit: cover; }
button.act, .btn { font: inherit; font-weight: 700; border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); padding: 10px 20px; border-radius: 8px; cursor: pointer; }
button.act.ghost, .btn.ghost { background: transparent; color: var(--accent); }
button.sm, .upl { font-size: 12px; padding: 5px 12px; }
button:disabled { opacity: .4; cursor: not-allowed; }

/* select */
.strip { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 16px; }
.slots { display: flex; flex-wrap: wrap; gap: 8px; flex: 1 1 260px; min-width: 0; }
.slot { font-family: var(--font-mono); font-size: 13px; border: 1px dashed var(--line); border-radius: 8px; padding: 6px 12px; min-width: 96px; text-align: center; color: var(--muted); }
.slot.on { border-style: solid; border-color: var(--accent); color: var(--fg); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; align-items: center; }
.roster { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.card { position: relative; text-align: left; font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; gap: 12px; cursor: pointer; min-width: 0; }
.card:hover { border-color: var(--muted); }
.card[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.card .info { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.card .nm { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-weight: 700; }
.card .yr, .card .st { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.card .bl { font-size: 12px; color: var(--muted); line-height: 1.5; }
.card .abl { font-size: 12px; line-height: 1.5; }
.card .abl b, .ab b { color: var(--accent); }
.order { position: absolute; top: 8px; right: 10px; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--on-accent); font-family: var(--font-mono); font-size: 12px; font-weight: 500; display: grid; place-items: center; }

/* battle */
.battle { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.arena, .side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.fighter { display: flex; gap: 14px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.fighter .glyph { width: 88px; height: 88px; }
.fighter.foe { margin-right: 36px; }
.fighter.you { margin-left: 36px; }
.fighter.down { opacity: .45; transform: translateY(10px) scale(.97); filter: grayscale(1); }
.fighter.hit { animation: shake .4s; }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
.fbody { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.fname { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.fname strong { font-size: 18px; }
.who { font-family: var(--font-mono); font-size: 11px; color: var(--muted); margin-left: auto; letter-spacing: .1em; }
.ab { font-size: 12px; line-height: 1.5; color: var(--muted); }
.bds { display: flex; flex-wrap: wrap; gap: 4px; min-height: 20px; }
.bd { font-family: var(--font-mono); font-size: 11px; padding: 0 7px; border-radius: 5px; border: 1px solid var(--line); color: var(--muted); }
.bd.up { color: var(--hp-ok); border-color: var(--hp-ok); }
.bd.down { color: var(--hp-low); border-color: var(--hp-low); }
.bd.st { color: var(--t1); border-color: var(--t1); }
.hp { position: relative; height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; }
.hp-lag { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; background: color-mix(in srgb, var(--hp-low) 55%, transparent); transition: width 1s ease .35s; }
.hp-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; transition: width .45s ease; }
.hp-fill.low { animation: lowpulse 1s ease-in-out infinite; }
@keyframes lowpulse { 50% { opacity: .55; } }
.hp-fill.ok { background: var(--hp-ok); } .hp-fill.mid { background: var(--hp-mid); } .hp-fill.low { background: var(--hp-low); }
.hpnum { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pips { display: flex; gap: 5px; }
.pips i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--muted); }
.pips i.on { background: var(--fg); border-color: var(--fg); }
.turn { font-family: var(--font-mono); font-size: 12px; color: var(--muted); letter-spacing: .1em; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 12px; }
.moves { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.move { font: inherit; text-align: left; color: var(--fg); background: color-mix(in srgb, var(--c) 8%, var(--panel)); border: 1.5px solid var(--c); border-radius: 10px; padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.move:hover:not(:disabled) { background: color-mix(in srgb, var(--c) 18%, var(--panel)); }
.mn { font-weight: 700; font-size: 14px; line-height: 1.4; }
.mm { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.mt { font-size: 11px; color: var(--fg); line-height: 1.5; }
.move em { font-style: normal; font-size: 12px; font-weight: 700; color: var(--muted); }
.move em.up { color: var(--hp-ok); } .move em.down { color: var(--hp-low); }
.bench { display: flex; flex-direction: column; gap: 6px; }
.sw { font: inherit; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; display: flex; align-items: center; gap: 10px; cursor: pointer; text-align: left; }
.sw .hp { flex: 1; min-width: 40px; }
.hint { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.log { font-size: 14px; display: flex; flex-direction: column; gap: 4px; min-height: 9.5em; }
.log div { color: var(--muted); }
.log div:last-child { color: var(--fg); font-weight: 700; }
.result { text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; padding: 8px 0; }
.result h3 { font-family: var(--font-display); font-weight: 400; font-size: 26px; margin: 0; }

.space { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 13px; display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; color: var(--muted); }
.space.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--panel)); color: var(--fg); }
.space b { color: var(--accent); }
.arena { border-radius: 14px; transition: background .6s; }
.arena[data-sp="E"] { background-image: linear-gradient(color-mix(in srgb, var(--t2) 16%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--t2) 16%, transparent) 1px, transparent 1px); background-size: 24px 24px; }
.arena[data-sp="H"] { background-image: repeating-radial-gradient(circle at 50% 50%, transparent 0 22px, color-mix(in srgb, var(--t1) 18%, transparent) 22px 23px); }
.arena[data-sp="C"] { background-image: linear-gradient(color-mix(in srgb, var(--t3) 30%, transparent), color-mix(in srgb, var(--t3) 30%, transparent)), linear-gradient(color-mix(in srgb, var(--t3) 30%, transparent), color-mix(in srgb, var(--t3) 30%, transparent)); background-size: 1px 100%, 100% 1px; background-position: center, center; background-repeat: no-repeat; }
.arena[data-sp="P"] { background-image: radial-gradient(color-mix(in srgb, var(--t4) 32%, transparent) 1.5px, transparent 2px); background-size: 16px 16px; }
.arena[data-sp="L"] { background-image: repeating-linear-gradient(45deg, transparent 0 14px, color-mix(in srgb, var(--t5) 16%, transparent) 14px 15px); }
.arena[data-sp="J"] { background-image: repeating-conic-gradient(from 0deg at 50% 50%, color-mix(in srgb, var(--t0) 14%, transparent) 0 6deg, transparent 6deg 24deg); }
.arena[data-sp="T"] { background-image: repeating-radial-gradient(ellipse 60% 30% at 50% 50%, transparent 0 18px, color-mix(in srgb, var(--t3) 18%, transparent) 18px 19px); }
.banner { position: fixed; top: 22%; left: 50%; transform: translateX(-50%); z-index: 70; pointer-events: none; text-align: center; background: var(--panel); border: 2px solid var(--c); border-radius: 12px; padding: 12px 22px; display: flex; flex-direction: column; gap: 2px; max-width: calc(100vw - 32px); box-shadow: 0 8px 30px color-mix(in srgb, var(--c) 35%, transparent); animation: bannerIn 2.3s ease both; }
.banner b { font-family: var(--font-display); font-weight: 400; font-size: 26px; color: var(--c); }
.banner span { font-size: 13px; color: var(--muted); }
@keyframes bannerIn { 0% { opacity: 0; transform: translateX(-50%) translateY(-24px) scale(.96); } 12% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateX(-50%) translateY(-8px); } }
.move:hover:not(:disabled) { transform: translateY(-1px); }
.lobby { margin-bottom: 12px; }
.online { display: flex; flex-direction: column; gap: 10px; max-width: 640px; }
.fld { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 700; }
.fld textarea { font-family: var(--font-mono); font-size: 11px; line-height: 1.4; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); resize: vertical; word-break: break-all; width: 100%; }
.steps { margin: 0; padding-left: 1.3em; font-size: 14px; }
.warn { color: var(--hp-low); font-size: 13px; }
.moves .move:last-child:nth-child(odd) { grid-column: 1 / -1; }
.log div:last-child { animation: fadein .3s ease; }
@keyframes fadein { from { opacity: 0; transform: translateY(3px); } }
.space em { font-style: normal; font-family: var(--font-mono); font-size: 12px; margin-left: auto; }
/* dex */
.dex { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
.entry { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.entry .top { display: flex; gap: 14px; align-items: center; }
.entry .glyph { width: 96px; height: 96px; }
.entry .nm { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-weight: 700; font-size: 18px; }
.entry ul { margin: 0; padding-left: 1.2em; font-size: 13px; display: flex; flex-direction: column; gap: 2px; }
.entry .note { font-size: 13px; color: var(--muted); line-height: 1.6; }
.entry .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.upl { display: inline-block; border: 1px solid var(--accent); color: var(--accent); border-radius: 8px; cursor: pointer; font-weight: 700; }
.upl input { position: absolute; width: 1px; height: 1px; opacity: 0; }

/* plan */
.doc { max-width: 780px; display: flex; flex-direction: column; gap: 28px; }
.doc section { display: flex; flex-direction: column; gap: 10px; }
.doc ol, .doc ul { margin: 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: 4px; }
.scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 7px 10px; text-align: center; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-weight: 700; }
tr:last-child td, tr:last-child th { border-bottom: 0; }
td.l, th.l { text-align: left; }
td.w { white-space: normal; text-align: left; min-width: 260px; }
.cell-up { background: color-mix(in srgb, var(--hp-ok) 22%, transparent); font-weight: 700; }
.cell-down { background: color-mix(in srgb, var(--hp-low) 16%, transparent); color: var(--muted); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.formula { font-family: var(--font-mono); font-size: 13px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; overflow-x: auto; white-space: pre; line-height: 1.8; }
.cycle { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
footer { font-size: 12px; color: var(--muted); }

@media (max-width: 760px) {
  .battle { grid-template-columns: minmax(0, 1fr); }
  .fighter.foe { margin-right: 12px; } .fighter.you { margin-left: 12px; }
  .moves { grid-template-columns: minmax(0, 1fr); }
  .dex { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { .fighter.hit, .eye, .fighter .glyph > svg, .hp-fill.low, .banner { animation: none; } .hp-fill, .hp-lag { transition: none; } }
</style>

<div class="wrap">
  <header>
    <div>
      <div class="sub">Mathematician Champions · 3 vs 3</div>
      <h1>数学者チャンピオンズ</h1>

    <div class="tabs" role="tablist">
      <button role="tab" data-tab="battle" aria-selected="true">対戦</button>

  <main id="app"></main>

<script>
const TYPES = ['数論', '代数', '幾何', '解析', '確率', '論理'];
// 6分野は輪になっている。攻撃側から見て次の2分野に強く(×2)、手前の2分野に弱い(×0.5)。
function eff(a, d) { const k = (d - a + 6) % 6; return (k === 1 || k === 2) ? 2 : (k === 4 || k === 5) ? 0.5 : 1; }

const AB = {
  gauss: ['王の風格', '抜群の技のダメージが1.2倍になる。'],
  ramanujan: ['天啓', 'ひらめきの一撃が出やすい(1/16 → 1/6)。'],
  euler: ['連続的な成長', 'ターン終了時にHPが1/16回復する。'],
  riemann: ['臨界線', 'HPが半分以下になると攻撃が1段階上がる(1回だけ)。'],
  euclid: ['公準', '幾何の技が必ず命中する。'],
  archimedes: ['てこの原理', '威力65以下の技のダメージが1.5倍になる。'],
  galois: ['遺された手紙', '倒れたとき、相手に最大HPの1/4のダメージを与える。'],
  seki: ['秘伝', '抜群で受けるダメージが25%軽くなる。'],
  pascal: ['期待値', '命中90以下の技が必ず命中する。'],
  laplace: ['全てお見通し', 'ひらめきの一撃を受けない。'],
  godel: ['不完全性', '満タンから一撃で倒されるとき、HP1で耐える(1回だけ)。'],
  turing: ['解読', '技の追加効果が出る確率が2倍。難問にならない。'],
  fermat: ['余白に収まらない証明', '場に出て3ターン後に攻撃が1段階上がる(1回だけ)。'],
  noether: ['対称性', '登場時に防御が1段階上がる。'],
  hypatia: ['学園の灯', '登場時に控えの味方のHPを8%回復する。'],

function fxTags(fx) {
  if (!fx) return [];
  const t = [], c = fx.c && fx.c < 100 ? `${fx.c}%で` : '';
  if (fx.pr) t.push('先制');
  if (fx.guard) t.push('このターンの攻撃を防ぐ(連続は失敗)');
  if (fx.multi) t.push('2回攻撃');
  if (fx.spw) t.push('空間が広がっていると1.5倍');
  if (fx.space) t.push(`${SP[fx.space].name}を展開`);
  if (fx.clear) t.push(fx.clear > 1 ? '相手の強化と空間を消し、自分の難問を治す' : '相手の強化を打ち消す');
  if (fx.heal) t.push(`HP${Math.round(fx.heal * 100)}%回復`);
  if (fx.lemma) t.push('次の攻撃が1.5倍');
  if (fx.drain) t.push(`ダメージの${Math.round(fx.drain * 100)}%吸収`);
  if (fx.recoil) t.push(`反動${Math.round(fx.recoil * 100)}%`);
  if (fx.status) t.push(`${c}難問`);
  for (const k in (fx.self || {})) t.push(`${c}自分の${LS[k]}${fx.self[k] > 0 ? '+' : ''}${fx.self[k]}`);
  for (const k in (fx.foe || {})) t.push(`${c}相手の${LS[k]}${fx.foe[k] > 0 ? '+' : ''}${fx.foe[k]}`);
  return t;
}

    <section><h2>空間</h2>
      <p>戦場には「空間」が広がることがある。特定の技や特性で展開され、5ターン続く。空間にいる間は、技の分野によって威力が変わる。別の空間が広がると上書きされる。</p>
      <div class="scroll"><table><thead><tr><th class="l">空間</th><th class="l">強まる分野(×1.3)</th><th class="l">弱まる分野(×0.8)</th><th class="l">広げる方法</th></tr></thead><tbody>
      ${Object.entries({ E: 'ユークリッドの「平行線公準」', H: 'ロバチェフスキーの登場時、または「双曲幾何」', C: 'コーシーの登場時、または「コーシーの積分定理」', P: 'コルモゴロフの「確率の公理化」', L: 'ヒルベルトの「ヒルベルト空間」', J: 'グロタンディークの「射影スキーム」', T: 'ポアンカレの「トポロジーの創始」', S: 'アルキメデスの「球と円柱」' }).map(([k, how]) => `<tr><td class="l"><strong>${SP[k].name}</strong></td><td class="l">${SP[k].up.map(t => chip(t)).join(' ')}</td><td class="l">${SP[k].down.map(t => chip(t)).join(' ')}</td><td class="w">${how}</td></tr>`).join('')}
      </tbody></table></div></section>
    <section><h2>ダメージの式</h2>
      <div class="formula">ダメージ = ((攻 ÷ 相手の防) × 威力 × 0.32 + 2)
         × 得意分野ボーナス(技の分野 = 自分の分野なら 1.5)
         × 相性(2 / 1 / 0.5)
         × 空間(強まる分野 1.3 / 弱まる分野 0.8)
         × 補題(使用後の次の攻撃なら 1.5)
         × 乱数(0.85〜1.0)
         × ひらめき(通常 1/16 の確率で 1.5)</div>
      <p class="muted">攻撃・防御・速さは段階で変化し、+1で×1.5、+2で×2、-1で×0.67、-2で×0.5になる(±3まで)。威力が高い技ほど外れやすい。</p></section>
    <section><h2>技の追加効果</h2>
      <ul>
        <li><strong>能力変化</strong>：自分の攻撃を上げる、相手の防御や速さを下げる。発動率が書かれた技は、その確率でだけ起きる。</li>
        <li><strong>難問</strong>：解けない問題に取り憑かれる状態。毎ターン終了時に最大HPの1/8を失い、交代しても治らない。</li>
        <li><strong>補題</strong>：補助技。使った次の攻撃が1.5倍になる。</li>
        <li><strong>先制</strong>：速さに関係なく先に動く。</li>
        <li><strong>反例</strong>：相手が積み上げた攻撃・防御・速さの上昇と補題を、まとめて元に戻す。補助技の「反例」「反例の提示」のほか、ワイエルシュトラスやカントールの攻撃技にもついている。ブールの「背理法」はさらに強く、広がっている空間も消し、自分の難問も治す。ブールには反例が効かない。</li>
        <li><strong>空間展開</strong>：技が当たったあとに空間を広げる。</li>
        <li><strong>守る</strong>：先制で動き、そのターンの攻撃をすべて防ぐ。2回続けて使うと失敗する。</li>
        <li><strong>2回攻撃</strong>：1回の行動で2回当たる。</li>
        <li><strong>空間連動</strong>：どれかの空間が広がっている間、威力が1.5倍になる。</li>
        <li><strong>吸収・反動</strong>：与えたダメージの一部を回復する、または自分も受ける。</li>
        <li><strong>回復・自己強化</strong>：ヒルベルトのホテルで回復、ガロアの手紙で攻撃を2段階上げる、など。</li>
      </ul></section>
    <section><h2>特性一覧</h2>
      <p>数学者ごとに1つ。逸話や業績から決めている。</p>
      <div class="scroll"><table><thead><tr><th class="l">数学者</th><th class="l">特性</th><th class="l">効果</th></tr></thead><tbody>${abs}</tbody></table></div></section>
    <section><h2>数学者ロスター(${M.length}人)</h2>
      <div class="scroll"><table><thead><tr><th class="l">名前</th><th>分野</th><th>HP</th><th>攻</th><th>防</th><th>速</th><th class="l">特性</th></tr></thead><tbody>${roster}</tbody></table></div>
      <p class="muted">各分野に6〜7人ずつ。技や逸話は図鑑タブで読める。</p></section>
    <section><h2>オンライン対戦</h2>
      <p>2人のブラウザを、WebRTCで直接つなぐ。中継サーバーは使わないので、運営の設備は要らない。</p>
      <ol>
        <li>1人が「部屋を作る」でコードを作り、相手に送る。</li>
        <li>もう1人が「部屋に入る」でコードを貼り付け、返信コードを作って送り返す。</li>
        <li>部屋の主が返信コードを貼り付けて接続する。つながったら、それぞれ3人を選んで「準備完了」。</li>
      </ol>
      <p class="muted">対戦は、両者が同じ種の乱数から同じ計算をする方式。毎ターン、行動だけを送り合い、結果は各自のブラウザが同じ手順で計算する。命中、ひらめき、乱数の幅も両者で一致する。接続できるのは、公開したページ(GitHub Pagesなど)をブラウザで直接開いたとき。共有プレビューのような埋め込み表示では、ブラウザの制限で通信できないことがある。</p></section>
    <section><h2>CPUの強さ</h2>
      <p>対戦前の画面で、やさしい・ふつう・つよいを選べる。やさしいは技をでたらめに選ぶことが多く、交代もしない。つよいは、相性と威力から最善に近い技を選び、不利なら積極的に交代する。</p></section>
    <section><h2>演出</h2>
      <ul>
        <li>技が当たると、技の分野に合った記号(数論なら素数、解析なら∫や∞、論理なら∴や∀)が飛び散り、ダメージ数字が浮かぶ。</li>
        <li>抜群やひらめきの一撃では、記号が増えて画面が揺れる。</li>
        <li>HPバーはダメージ量だけ遅れて追いかける。HPが少なくなると点滅する。</li>
        <li>空間が広がると画面に名前が出て、戦場の背景が空間の模様(格子、同心円、座標軸、点、斜線、放射、楕円の輪)に変わる。</li>
        <li>能力の上下、回復、守る、倒れる、勝敗にもそれぞれ演出と効果音がある。効果音は戦闘画面で切り替えられる。動きを減らす設定の端末では、画面の揺れと粒子を止める。</li>
      </ul></section>
    <section><h2>見た目と写真</h2>
      <p>実在の人物の写真は同梱せず、髪型、ひげ、眼鏡、服装で描き分けた似顔絵風のイラストを使う。右下の丸い印は、各人の業績をモチーフにした紋章(正規分布の曲線、ヒルベルト曲線、パスカルの三角形など)。手元にある画像は図鑑から設定でき、その端末のブラウザにだけ保存される。</p></section>
    <section><h2>今後の拡張案</h2>
      <ul>
        <li>空間の追加：メビウスの帯、複素射影空間など。空間が変わった瞬間に発動する特性も増やす。</li>
        <li>数学者の追加：ヴァイユ、ゲルファント、ラマヌジャンの師ハーディなど。世界各地の数学者を増やしたい。</li>
        <li>オンライン対戦の観戦、ルームコードだけでつながる中継サーバー(任意)。</li>
        <li>学習モード：技を使うと業績カードが解放される。</li>
        <li>育成と対人戦：技の習得、ランクマッチ、友達との通信対戦。</li>
      </ul></section>
    <section><h2>権利面の方針</h2>
      <p>既存ゲームの名称、キャラクター、デザイン、技名、画面素材は使わず、実在した数学者と数学用語だけで構成する。公開や配布を考える場合は、タイトルも既存作品と紛らわしくならない独自のものに変える。</p></section>
  </div>`;

  return PC;
}
function slowWarn() { setTimeout(() => { if (!NET && ONL.open && (ONL.step === 'host' || ONL.step === 'guest') && !ONL.error) { ONL.error = 'まだつながりません。コードが最後まで貼れているか確認してください。ネットワークによってはつながらないことがあります。'; render(); } }, 30000); }
async function netHost() {
  ONL.role = 'host'; ONL.step = 'host'; ONL.code = ''; ONL.paste = ''; ONL.error = ''; ONL.status = ''; render();
  try {
    const pc = newPC(); setupDC(pc.createDataChannel('mc'));
    await pc.setLocalDescription(await pc.createOffer()); await gathered(pc);
    ONL.code = await packDesc(pc.localDescription);
  } catch (e) { ONL.error = '部屋を作れませんでした。'; }
  render();
}
async function netHostConnect() {
  ONL.error = '';
  try { await PC.setRemoteDescription(await unpackDesc(ONL.paste)); ONL.status = '接続しています…'; slowWarn(); } catch (e) { ONL.error = '返信コードを読み取れませんでした。'; }
  render();
}
async function netGuestAnswer() {
  ONL.error = ''; ONL.code = '';
  try {
    const offer = await unpackDesc(ONL.paste);
    const pc = newPC(); pc.ondatachannel = e => setupDC(e.channel);
    await pc.setRemoteDescription(offer); await pc.setLocalDescription(await pc.createAnswer()); await gathered(pc);
    ONL.code = await packDesc(pc.localDescription); ONL.status = '返信コードを部屋の主に送ってください。つながると自動で進みます。'; slowWarn();
  } catch (e) { ONL.error = 'コードを読み取れませんでした。'; }
  render();
}
function netLeave() {
  if (DC) { DC.onclose = null; DC.onmessage = null; try { netSend({ t: 'bye' }); DC.close(); } catch (e) { } }
  if (PC) { PC.onconnectionstatechange = null; try { PC.close(); } catch (e) { } }
  DC = PC = null; NET = null; inbox = [];
  waiters.forEach(w => w.rej(new Error('closed'))); waiters = [];
  Object.assign(ONL, { step: 'menu', role: null, code: '', paste: '', status: '', error: '', ready: false, oppTeam: null, hostReady: false });
  ME = 'you'; OPP = 'foe'; R = Math.random; S = null;
}
function netLost() {
  waiters.forEach(w => w.rej(new Error('closed'))); waiters = [];
  if (!NET) return;
  if (S && S.phase !== 'over') { S.phase = 'over'; S.busy = false; S.lost = true; S.won = false; S.draw = false; say('相手との接続が切れた。'); render(); }
  else if (!S) { netLeave(); ONL.open = true; ONL.error = '相手との接続が切れました。'; render(); }
}
function lobbyStatus() { const opp = NET.host ? ONL.oppTeam : ONL.hostReady; return `相手：${opp ? '準備完了' : '選択中'}。`; }
function netReady() {
  ONL.ready = true;
  if (NET.host) { netSend({ t: 'ready' }); netMaybeStart(); } else netSend({ t: 'team', ids: sel.slice() });
  render();
}
function netMaybeStart() {
  if (!NET || !NET.host || !ONL.ready || !ONL.oppTeam) return;
  const seed = crypto.getRandomValues(new Uint32Array(1))[0], h = sel.slice(), g = ONL.oppTeam;
  netSend({ t: 'start', host: h, guest: g, seed });
  startPvp(h, g, seed);
}
async function startPvp(hostIds, guestIds, seed) {
  ONL.ready = false; ONL.oppTeam = null; ONL.hostReady = false; inbox = [];
  R = mulberry(seed); ME = NET.host ? 'you' : 'foe'; OPP = other(ME); lastW = {};
  S = { team: { you: hostIds.map(id => mkMon(id, 'you')), foe: guestIds.map(id => mkMon(id, 'foe')) }, i: { you: 0, foe: 0 }, log: [], busy: true, phase: 'run', turn: 1, hit: null, won: false, space: null, waiting: false };
  say(`相手は${cur(OPP).m.name}を繰り出した！`);
  say(`行け、${cur(ME).m.name}！`);
  render(); await sleep(600);
  enter(cur('you')); enter(cur('foe'));
  S.busy = false; S.phase = 'cmd'; render();
}
// 相手から届いた値は信用せず、両者が同じ関数で補正する(不正な入力でも結果がずれない)
function sanAct(side, a) {
  const c = cur(side);
  if (a && a.k === 'sw' && Number.isInteger(a.i) && S.team[side][a.i] && a.i !== S.i[side] && S.team[side][a.i].hp > 0) return { k: 'sw', i: a.i };
  if (a && a.k === 'move' && Number.isInteger(a.i) && c.m.moves[a.i]) return { k: 'move', i: a.i };
  return { k: 'move', i: 0 };
}
function sanPick(side, i) {
  const al = alive(side);
  return Number.isInteger(i) && al.includes(i) ? i : al[0];
}
async function takeTurnNet(action) {
  try {
    netSend({ t: 'act', n: S.turn, a: action });
    S.waiting = !inbox.some(m => m.t === 'act' && m.n === S.turn); render();
    const m = await waitMsg(m => m.t === 'act' && m.n === S.turn);
    S.waiting = false;
    const mine = action, theirs = m.a;
    const aYou = sanAct('you', NET.host ? mine : theirs), aFoe = sanAct('foe', NET.host ? theirs : mine);
    await resolveTurn(aYou, aFoe);
  } catch (e) { }
}
async function netForced(needs) {
  const picks = {};
  if (needs.includes(ME)) {
    S.phase = 'forced'; S.busy = false; say('次に出す数学者を選ぼう。'); render();
    const i = await new Promise(r => { S.pickResolve = r; });
    S.busy = true; S.phase = 'wait'; picks[ME] = i; netSend({ t: 'pick', n: S.turn, i }); S.waiting = needs.includes(OPP); render();
  } else { S.phase = 'wait'; S.busy = true; S.waiting = true; render(); }
  if (needs.includes(OPP)) { const m = await waitMsg(m => m.t === 'pick' && m.n === S.turn); picks[OPP] = m.i; }
  S.waiting = false;
  for (const s of ['you', 'foe']) if (needs.includes(s)) await switchTo(s, sanPick(s, picks[s]), true);
}
function renderOnline() {
  const o = ONL;
  const note = '<p class="muted" style="font-size:12px">2人のブラウザを直接つなぐ仕組み(WebRTC)です。中継サーバーを使わないので、コードを送り合う手間がありますが、公開用の設備は要りません。共有プレビューなど、埋め込み表示のページでは接続できないことがあります。公開したページをブラウザで直接開いて遊んでください。</p>';
  const err = o.error ? `<p class="warn">${esc(o.error)}</p>` : '';
  const st = o.status ? `<p class="muted">${esc(o.status)}</p>` : '';
  let body = '';
  if (!CAN_P2P) body = '<p class="warn">このブラウザはWebRTCに対応していないため、オンライン対戦は使えません。</p>';
  else if (o.step === 'menu') body = '<p>相手と接続コードを送り合って対戦します。チャットなどで送れば大丈夫です。</p><div class="btns"><button class="act" data-act="net-host">部屋を作る</button><button class="act ghost" data-act="net-join">部屋に入る</button></div>';
  else if (o.step === 'host') body = `<ol class="steps"><li>「あなたのコード」を相手に送ります。</li><li>相手から届いた「返信コード」を下の欄に貼り付けて、接続を押します。</li></ol>
    <label class="fld">あなたのコード<textarea id="codeOut" rows="4" readonly>${o.code || '作成中…'}</textarea></label>
    <div class="btns"><button class="act ghost sm" data-act="net-copy">コードをコピー</button></div>
    <label class="fld">相手の返信コード<textarea id="codeIn" rows="4" data-paste="1">${esc(o.paste)}</textarea></label>
    <div class="btns"><button class="act" data-act="net-connect" ${o.code ? '' : 'disabled'}>接続</button></div>`;
  else body = `<ol class="steps"><li>部屋の主から届いたコードを貼り付けて、「返信コードを作る」を押します。</li><li>できた返信コードを部屋の主に送ります。つながると自動で進みます。</li></ol>
    <label class="fld">部屋の主のコード<textarea id="codeIn" rows="4" data-paste="1">${esc(o.paste)}</textarea></label>
    <div class="btns"><button class="act" data-act="net-answer">返信コードを作る</button></div>
    ${o.code ? `<label class="fld">あなたの返信コード<textarea id="codeOut" rows="4" readonly>${o.code}</textarea></label><div class="btns"><button class="act ghost sm" data-act="net-copy">コードをコピー</button></div>` : ''}`;
  return `<div class="panel online"><h2>オンライン対戦</h2>${body}${err}${st}<div class="btns" style="margin-top:12px"><button class="act ghost" data-act="net-back">戻る</button></div>${note}</div>`;
}

/* ---------- イベント ---------- */
$app.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act !== 'snd') sfx('tick');
  if (act === 'pick') {
    const id = b.dataset.id, k = sel.indexOf(id);
    if (k >= 0) sel.splice(k, 1); else if (sel.length < 3) sel.push(id);
    render();
  } else if (act === 'filter') { filt = +b.dataset.t; render(); }
  else if (act === 'random') { sel = M.map(m => m.id).sort(() => Math.random() - 0.5).slice(0, 3); render(); }
  else if (act === 'clear') { sel = []; render(); }
  else if (act === 'start' || act === 'again') startBattle(false);
  else if (act === 'next') startBattle(true);
  else if (act === 'menu') { S = null; render(); }
  else if (act === 'level') { level = b.dataset.l; try { localStorage.setItem('mc_level', level); } catch (e) { } render(); }
  else if (act === 'online') { ONL.open = true; ONL.step = 'menu'; ONL.error = ''; ONL.status = ''; render(); }
  else if (act === 'net-host') netHost();
  else if (act === 'net-join') { ONL.role = 'guest'; ONL.step = 'guest'; ONL.code = ''; ONL.paste = ''; ONL.error = ''; ONL.status = ''; render(); }
  else if (act === 'net-answer') netGuestAnswer();
  else if (act === 'net-connect') netHostConnect();
  else if (act === 'net-copy') { const t = document.getElementById('codeOut'); if (t) { t.select(); try { navigator.clipboard.writeText(t.value).catch(() => { }); } catch (e) { } } }
  else if (act === 'net-back' || act === 'leave') { netLeave(); ONL.open = false; render(); }
  else if (act === 'ready') netReady();
  else if (act === 'lobby') { S = null; render(); }
  else if (act === 'move') takeTurn({ k: 'move', i: +b.dataset.i });
  else if (act === 'sw') takeTurn({ k: 'sw', i: +b.dataset.i });
  else if (act === 'forced') {
    if (S.busy) return;
    if (NET) { if (S.pickResolve) { const f = S.pickResolve; S.pickResolve = null; f(+b.dataset.i); } return; }
    S.busy = true; await switchTo('you', +b.dataset.i, true);
    S.phase = 'cmd'; S.busy = false; render();
  } else if (act === 'hint') { showHint = b.checked; render(); }
  else if (act === 'snd') { soundOn = b.checked; if (soundOn) sfx('tick'); }
  else if (act === 'unportrait') { delete portraits[b.dataset.id]; savePortraits(); render(); }
});
$app.addEventListener('input', e => { if (e.target && e.target.dataset && e.target.dataset.paste) ONL.paste = e.target.value; });
$app.addEventListener('change', e => {
  const inp = e.target.closest('[data-portrait]');
  if (!inp || !inp.files || !inp.files[0]) return;
  const id = inp.dataset.portrait, fr = new FileReader();
  fr.onload = () => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = c.height = 160;
      const s = Math.min(img.width, img.height);
      c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 160, 160);
      portraits[id] = c.toDataURL('image/jpeg', 0.82); savePortraits(); render();
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(inp.files[0]);
});
document.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => { location.hash = b.dataset.tab; render(); }));
addEventListener('hashchange', render);
render();
</script>
